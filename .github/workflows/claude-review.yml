name: Claude Review

# Consumer caller: copy into a repo's .github/workflows/.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    uses: DavidKelly94/base/.github/workflows/claude-review-reusable.yml@v1
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets: inherit
