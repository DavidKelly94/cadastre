# The display name is `CI` because base's adopted main-triage.yml triggers on
# workflow_run for workflows: ["CI"]. The filename stays core-test.yml.
name: CI
on: [push, pull_request]
jobs:
  swift:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path ios/VividHomeCore
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project pipeline
      - run: uv run --project pipeline ruff check pipeline
      - run: uv run --project pipeline pytest pipeline -q

  # The only job that puts the two implementations in contact: Swift writes a
  # session with VividHomeCore, Python validates it with the pipeline. Every other
  # test checks one side against its own idea of the other, so this is what would
  # catch the two halves of docs/session-format.md drifting apart.
  contract:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Write a session with VividHomeCore
        run: |
          swift run --package-path ios/VividHomeCore vividhome-fixture \
            "$PWD/fixture-session" "$PWD/fixture-contract.json"
      - name: Validate it with the pipeline
        # Warnings fail this job as well as errors. On a synthetic session every
        # rule should pass outright, so a warning here means something drifted.
        run: |
          uv sync --project pipeline
          uv run --project pipeline vividhome validate "$PWD/fixture-session" --skip-images \
            | tee validate.txt
          if grep -q "^WARN" validate.txt; then
            echo "::error::the fixture session should validate with no warnings"
            exit 1
          fi
      - name: Hold the phone's field maths against the pipeline's
        # The corner snap and the live wall coverage on the phone are ports of
        # corners.py and coverage.py. The fixture ran both on the room it wrote;
        # the pipeline runs its own here and the answers have to agree.
        env:
          VIVIDHOME_CONTRACT_SESSION: ${{ github.workspace }}/fixture-session
          VIVIDHOME_CONTRACT_JSON: ${{ github.workspace }}/fixture-contract.json
        run: |
          uv run --project pipeline pytest pipeline/tests/test_contract.py -q -rs
