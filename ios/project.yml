name: VividHome
options:
  bundleIdPrefix: ai.vividhome
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  VividHomeCore:
    path: VividHomeCore
targets:
  VividHome:
    type: application
    platform: iOS
    sources: [VividHome]
    dependencies:
      - package: VividHomeCore
        product: VividHomeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.vividhome.app
        PRODUCT_NAME: VividHome
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    info:
      path: VividHome/Info.plist
      properties:
        CFBundleDisplayName: VividHome
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit, arm64]
        NSCameraUsageDescription: "VividHome records the camera and LiDAR to document your house during construction."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
